<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#ldr{position:fixed;inset:0;z-index:10001;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(5vh,28px);touch-action:manipulation;-webkit-user-select:none;user-select:none;text-shadow:none}
#ldr.rdy{cursor:pointer}
#ldr .ld-ball{position:relative;width:min(34vmin,170px);height:min(34vmin,170px);border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff1c2 0,#ffc04a 14%,#ff9418 42%,#e8620a 72%,#a8400a 100%);box-shadow:0 0 34px #ff8a1a55,inset -8px -12px 24px #7a2a0055;display:flex;align-items:center;justify-content:center}
#ldr .ld-ball::after{content:'';position:absolute;left:17%;top:11%;width:32%;height:19%;border-radius:50%;background:radial-gradient(#ffffffbb,#fff0 70%);transform:rotate(-32deg)}
#ldr .ld-star{width:50%;height:50%;animation:ldSpin 1.6s linear infinite;filter:drop-shadow(0 1px 1px #6a0000aa)}
#ldr .ld-star polygon{fill:#e3202a;stroke:#9e0f14;stroke-width:2.5;stroke-linejoin:round}
#ldr .ld-tx{font:900 clamp(16px,min(4.4vw,6vh),26px) system-ui,-apple-system,Arial,sans-serif;letter-spacing:.32em;padding-left:.32em;color:#fff;animation:ldPulse 1.4s ease-in-out infinite}
#ldr.rdy .ld-tx{animation:none;opacity:1}
@keyframes ldSpin{to{transform:rotate(360deg)}}
@keyframes ldPulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>

<div id="ldr"><div class="ld-ball"><svg class="ld-star" viewBox="-50 -50 100 100" aria-hidden="true"><polygon points="0.0,-40.0 9.7,-13.3 38.0,-12.4 15.7,5.1 23.5,32.4 0.0,16.5 -23.5,32.4 -15.7,5.1 -38.0,-12.4 -9.7,-13.3"/></svg></div><div class="ld-tx">LOADING</div></div>
<script>(function(){var t=Date.now(),s=document.querySelector('#ldr .ld-star'),x=document.querySelector('#ldr .ld-tx');if(s)s.style.animationDelay=-(t%1600)+'ms';if(x)x.style.animationDelay=-(t%1400)+'ms'})();</script>
<script>
// Small start page: shows the loading screen (and gives link previews a light page to read), then loads the full game into this same page.
// (the 3D engine is fetched first so it is already cached when the game page asks for it)
(function(){var T='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',g=fetch('game.html').then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}),e=new Promise(function(ok){var sc=document.createElement('script');sc.src=T;sc.onload=sc.onerror=ok;document.head.appendChild(sc)});Promise.all([g,e]).then(function(v){document.open();document.write(v[0]);document.close()}).catch(function(){location.replace('game.html')})})();
</script>
